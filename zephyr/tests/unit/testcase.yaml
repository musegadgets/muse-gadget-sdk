common:
  platform_allow:
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim/native/64
  tags: muse_gadget
tests:
  muse_gadget.unit:
  muse_gadget.unit.rram:
    # The queue on rewritable media without erase, like the nRF54L's RRAM.
    extra_configs:
      - CONFIG_FLASH_SIMULATOR_EXPLICIT_ERASE=n
  muse_gadget.unit.slot1:
    # The queue in MCUboot's secondary slot, shared with OTA, on RRAM-style flash.
    extra_args:
      - DTC_OVERLAY_FILE=slot1.overlay
    extra_configs:
      - CONFIG_MG_QUEUE_IN_SLOT1=y
      - CONFIG_FLASH_SIMULATOR_EXPLICIT_ERASE=n
      - CONFIG_MG_HAPTICS=n
  muse_gadget.unit.secure:
    extra_configs:
      - CONFIG_MG_SECURE=y
