CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_CRC=y

CONFIG_MG_AUDIO_SRC_SYNTH=y
CONFIG_MG_NUS=n
CONFIG_MG_LC3=y
# A board with a vibration motor and a status light; the slot1 configuration
# turns haptics off, like the XIAO.
CONFIG_MG_HAPTICS=y
CONFIG_MG_ASSISTANT_STATE=y

# PSA Crypto (Link setup, token proof) needs a random source on native_sim.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG_ALLOW_NON_CSPRNG=y
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=16
CONFIG_MG_SDK_TOKEN="mgst_unit_test"

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ASSERT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
