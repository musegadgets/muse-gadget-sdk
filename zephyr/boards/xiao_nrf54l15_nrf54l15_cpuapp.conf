CONFIG_FPU=y

# Firmware updates over BLE: MCUmgr SMP (image and OS groups) beside the mg
# service, with MCUboot from sysbuild (sysbuild.conf). The image lives in
# slot0; MG_DFU confirms test images and shares slot1 with the clip queue.
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
# Throughput: one SMP request spans many ATT writes (reassembly) into a
# 2475-byte buffer, which clients learn from the OS group's MCUmgr
# parameters (buf_size, buf_count) and fill: about 2.4 KB of image per
# request instead of one ATT write's 200 B. Four buffers let a client keep
# two requests in flight (one more is the response). The image is written
# in 4 KB blocks, so each request costs at most one wait for a gap in the
# radio schedule (CONFIG_SOC_FLASH_NRF_RADIO_SYNC_TICKER) instead of five.
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_IMG_BLOCK_BUF_SIZE=4096
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
