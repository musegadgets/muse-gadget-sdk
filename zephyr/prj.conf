# Bluetooth: one peripheral connection, large MTU and data length for audio.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="MuseGadget"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=12
# Phone->device headroom (an SMP upload, set_tokens): the controller
# defaults to one RX PDU buffer and the host to two ACL buffers, and when
# the host can't drain them as fast as PDUs arrive (an image flash write
# running) the controller NACKs the rest of the connection event. In
# BabbleSim the host keeps up either way (163 KB/s received with 1 or 8);
# eight of each cost about 4 KB.
CONFIG_BT_CTLR_RX_BUFFERS=8
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=7
CONFIG_BT_BUF_EVT_RX_COUNT=16
# Every board this app builds for (the XIAO and any other nRF54L15) asks
# for 251-byte link-layer PDUs and the 2M PHY right after connecting
# (mg_ble.c) and logs what it gets; the controller's 2M PHY
# (CONFIG_BT_CTLR_PHY_2M) is on by default.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
# mg_connparam.c asks for the connection parameters itself (15 ms, latency
# 10, 4 s; latency off while the phone streams to the gadget), so the host
# doesn't send its own update. CONFIG_MG_CONN_* sets them, and the GAP
# preferred parameters follow (Kconfig).
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
# The host holds a peripheral's parameter requests back this long after
# connecting (the Core spec's TGAP(conn_pause_peripheral) is 1 s; Zephyr's
# default is 5 s, past most of a phone's setup traffic).
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=1000
CONFIG_BT_RX_STACK_SIZE=2560

# Standard services.
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_SW_REV=y

# Settings (push-to-talk, codec, haptics, queue) in ZMS.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
# PSA key slots: Link setup holds at most two keys at a time.
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=4

# Offline clip checksums.
CONFIG_CRC=y

# Button through the input subsystem (gpio-keys debounces).
CONFIG_INPUT=y
CONFIG_GPIO=y

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
