# The XIAO nRF54L15 boots through MCUboot (build with --sysbuild). Swap using
# move keeps test, confirm and revert: a new image runs on test, the app
# confirms it once BLE is up, and an image that never gets there is swapped
# back at the next reset. The image is signed with MCUboot's ECDSA P-256
# development key (bootloader/mcuboot/root-ec-p256.pem): anyone can sign for
# it, so production builds must set SB_CONFIG_BOOT_SIGNATURE_KEY_FILE to
# their own key (and keep it out of the repository).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
